version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "5173:5173"

  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
